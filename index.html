<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviator Predictor</title>
<style>
:root{--bg:#eef2f5;--ink:#14202b;--mut:#5b6b7a;--line:#cfd8e0;--a:#0b6e8a;--bet:#1d7a46;--wait:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font:700 1.8rem/1.2 Georgia,'Times New Roman',serif;margin:0 0 18px}
label{display:block;font-weight:600;margin:12px 0 4px}
textarea,input{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;font:15px ui-monospace,Menlo,monospace;background:#fff;color:var(--ink)}
textarea{min-height:110px}
.row{display:flex;gap:12px}.row>div{flex:1}
button{width:100%;margin-top:14px;background:var(--a);color:#fff;border:0;border-radius:4px;padding:13px;font:700 16px system-ui;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--wait);outline-offset:2px}
#out{margin-top:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px}
.v{font:700 2.6rem/1 Georgia,serif;margin:0 0 6px}
.bet{color:var(--bet)}.wait{color:var(--wait)}
.row2{margin:8px 0 0}
.mut{color:var(--mut);font-size:14px}
table{border-collapse:collapse;width:100%;margin-top:12px}
td{padding:6px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Aviator Predictor</h1>
<label for="rounds">Previous rounds (at least 10, oldest first)</label>
<textarea id="rounds" placeholder="1.23, 4.56, 1.01, 2.10, ..."></textarea>
<div class="row">
<div><label for="bal">Balance (R)</label><input id="bal" type="number" min="1" value="100"></div>
<div><label for="base">Bet size (R)</label><input id="base" type="number" min="0.5" step="0.5" value="1"></div>
</div>
<button id="go">Predict next round</button>
<div id="out"></div>
<p class="mut">Estimates only. Crash rounds are random.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const pct=x=>(100*x).toFixed(1)+"%";
function analyse(r,base){
  let waiting=true,skip=0,wins=0,b=base,stake=base;
  const dec=i=>{
    if(waiting)return["WAIT","Cooldown: waiting for an instaloss."];
    if(skip>0)return["WAIT","Instaloss just happened. Skip one more round."];
    if(i>=10&&r.slice(i-10,i).every(x=>x>=1.05))return["WAIT","No instaloss in the last 10 rounds."];
    return["BET","Conditions are clear."];
  };
  for(let i=0;i<r.length;i++){
    const a=dec(i)[0],il=r[i]<1.05,gap=!waiting&&skip===0&&a==="WAIT";
    if(waiting){if(il){waiting=false;skip=1}}
    else if(skip>0)skip--;
    else if(gap){if(il)skip=1}
    else if(!il){wins++;b*=1.02;stake=b;if(wins>=3){waiting=true;wins=0}}
    else{wins=0;stake=b*20}
  }
  let since=0;for(let i=r.length-1;i>=0&&r[i]>=1.05;i--)since++;
  return {d:dec(r.length),stake,b,since};
}
function go(){
  const r=$("rounds").value.split(/[\s,;]+/).map(s=>parseFloat(s.replace(/x$/i,""))).filter(x=>x>=1);
  const bal=+$("bal").value||0,base=+$("base").value||1,o=$("out");
  if(r.length<10){o.innerHTML=`<div class="card">Enter at least 10 previous rounds. You have ${r.length}.</div>`;return}
  const {d,stake,b,since}=analyse(r,base),bet=d[0]==="BET";
  let extra="";
  if(bet){
    const s=Math.min(stake,bal);
    extra=`<p class="row2"><b>Stake: R${s.toFixed(2)} at 1.05x</b></p>`;
    if(20*b>bal)extra+=`<p class="row2 wait">Bet too big for your balance. Lower it to about R${(bal/20).toFixed(2)}.</p>`;
  }
  const last=r[r.length-1];
  if(last>=50)extra+=`<p class="row2 wait">Last round was ${last.toFixed(2)}x. Ignore it.</p>`;
  o.innerHTML=`<div class="card"><p class="v ${bet?"bet":"wait"}">${d[0]}</p><p>${d[1]}</p>${extra}
  <p class="mut">Rounds since last instaloss: ${since}</p>
  <table>${[1.05,1.5,2,5,10].map(m=>`<tr><td>Next round reaches ${m}x</td><td>${pct(0.97/m)}</td></tr>`).join("")}</table></div>`;
}
$("go").onclick=go;
</script>
</body>
</html>
